name: Update rankings

on:
  push:
    branches: [main]
  schedule:
    # Tuesdays 16:00 UTC (noon ET / 9am PT) — after the outlets have published,
    # and again at 20:00 UTC to pick up any that ran late.
    - cron: "0 16 * * 2"
    - cron: "0 20 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (blank = current)"
        required: false
      week:
        description: "Ranking week (blank = current)"
        required: false
      backfill:
        description: "Also rebuild earlier weeks with no data"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-rankings
  cancel-in-progress: false

env:
  # Used for links inside the weekly email digest. Override by setting a
  # repository variable named SITE_URL (e.g. for a custom domain).
  SITE_URL: ${{ vars.SITE_URL || 'https://superpowerrankings.com/' }}
  # Monetisation is off until these repository variables exist. Set them under
  # Settings -> Secrets and variables -> Actions -> Variables. Each surface
  # renders nothing at all while its variable is unset.
  AD_CLIENT: ${{ vars.AD_CLIENT }}
  AD_SLOT_BOARD: ${{ vars.AD_SLOT_BOARD }}
  AD_SLOT_CONTENT: ${{ vars.AD_SLOT_CONTENT }}
  AD_SLOT_TEAM: ${{ vars.AD_SLOT_TEAM }}
  NEWSLETTER_ACTION: ${{ vars.NEWSLETTER_ACTION }}
  CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
  CF_ANALYTICS_TOKEN: ${{ vars.CF_ANALYTICS_TOKEN }}
  GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
  BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # A code push should redeploy the site, not re-scrape six outlets.
      # Only the Tuesday cron and a manual run actually fetch.
      - name: Fetch and aggregate
        if: github.event_name != 'push'
        run: |
          python -m superpower.run --verbose \
            --base-url "$SITE_URL" \
            ${{ inputs.season && format('--season {0}', inputs.season) || '' }} \
            ${{ inputs.week && format('--week {0}', inputs.week) || '' }} \
            ${{ inputs.backfill && '--backfill' || '' }}

      - name: Rebuild site data from the stored archive
        if: github.event_name == 'push'
        run: python -m superpower.run --compile-only --base-url "$SITE_URL"

      # Pushes made with GITHUB_TOKEN do not retrigger workflows, so this
      # cannot loop back into another run.
      - name: Commit any changes
        if: github.event_name != 'push'
        run: |
          git config user.name  "superpower-bot"
          git config user.email "actions@github.com"
          git add data site/share
          if git diff --cached --quiet; then
            echo "No ranking changes this run."
            exit 0
          fi
          git commit -m "data: rankings update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Assemble the deployable site
        run: python tools/build_site.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # Announce the new week. Runs only on the Tuesday schedule or a manual
  # dispatch — never on a code push, which would re-announce old rankings.
  # Every network is skipped unless its secret exists, and a ledger committed
  # back to the repo stops the second Tuesday run re-posting the first one.
  promote:
    needs: deploy
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      MASTODON_BASE_URL: ${{ secrets.MASTODON_BASE_URL }}
      MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
      REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
      REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      REDDIT_SUBREDDITS: ${{ vars.REDDIT_SUBREDDITS }}
      REDDIT_AUTOPOST: ${{ vars.REDDIT_AUTOPOST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests requests-oauthlib
      - name: Announce the new week
        run: python -m superpower.social
      - name: Record what was posted
        run: |
          git config user.name  "superpower-bot"
          git config user.email "actions@github.com"
          git add data/promoted.json
          git diff --cached --quiet || {
            git commit -m "data: recorded this week's announcements"
            git push
          }

  # Bing, Yandex, Seznam and Naver accept a push the moment pages change.
  # Google does not participate — it only takes submissions through Search
  # Console. Failing here must never fail the deploy.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only what the ping needs — no image or scraping dependencies here.
      - run: pip install requests
      - name: Announce changed URLs
        run: python -m superpower.indexnow
