<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team — Superpower Rankings</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="index.html">
      <span><span class="bolt">⚡</span> SUPERPOWER</span>
      <small>NFL consensus rankings</small>
    </a>
    <nav id="nav"><button id="theme" type="button" title="Toggle dark mode">◐</button></nav>
  </div>
</header>

<section class="hero" id="hero">
  <div class="wrap">
    <span class="chip" id="heroChip"></span>
    <div>
      <h1 id="heroName">Loading…</h1>
      <div class="sub" id="heroSub"></div>
    </div>
    <div class="statline" id="heroStats"></div>
  </div>
</section>

<div class="weekbar">
  <div class="wrap">
    <div class="weekpick">
      <button id="prev" type="button" title="Previous week">‹</button>
      <select id="week" aria-label="Select week"></select>
      <button id="next" type="button" title="Next week">›</button>
    </div>
    <select id="season" aria-label="Select season"></select>
    <select id="teamPick" aria-label="Switch team"></select>
    <a class="btn" id="compareLink" href="compare.html">Compare ⇄</a>
    <div class="meta" id="meta"></div>
  </div>
</div>

<main class="wrap">
  <section class="cards" id="context"></section>
  <div class="callout" id="outlierNote" style="display:none"></div>

  <div class="grid2">
    <section class="chartcard">
      <h2>Superpower rank by week</h2>
      <p class="note">Rank 1 sits at the top. Toggle an outlet to see how its ranking
        compares with the consensus.</p>
      <div class="legend" id="legend"></div>
      <div id="chart"></div>
    </section>

    <section class="tablecard">
      <div class="tablehead">
        <h2 id="outletTitle">Outlet by outlet</h2>
      </div>
      <div class="scroller">
        <table>
          <thead><tr>
            <th class="l">Outlet</th><th>Rank</th><th>Move</th>
            <th class="l">Article</th>
          </tr></thead>
          <tbody id="outlets"></tbody>
        </table>
      </div>
    </section>
  </div>

  <section class="tablecard" style="margin-top:16px">
    <div class="tablehead">
      <h2>Game log</h2>
      <span class="spacer"></span>
      <span class="pill" id="recordPill"></span>
    </div>
    <div class="scroller">
      <table>
        <thead><tr>
          <th class="l">Week</th><th class="l">Opponent</th><th>Result</th><th>Score</th>
          <th>Margin</th><th class="l">Rank after</th>
        </tr></thead>
        <tbody id="games"></tbody>
      </table>
    </div>
  </section>

  <section class="tablecard" style="margin-top:16px">
    <div class="tablehead"><h2>Week by week</h2></div>
    <div class="scroller">
      <table>
        <thead><tr id="wbwHead"></tr></thead>
        <tbody id="wbw"></tbody>
      </table>
    </div>
  </section>
</main>

<footer class="wrap"><p id="stamp"></p></footer>
<script type="module" src="assets/team.js"></script>
</body>
</html>
